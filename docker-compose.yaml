version: '3'
services:
  airflow-webserver:
    image: apache/airflow:2.7.3-python3.10
    command: webserver
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./airflow.db:/opt/airflow/airflow.db  # <--- CRITICAL FIX
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.10
    command: scheduler
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./airflow.db:/opt/airflow/airflow.db  # <--- CRITICAL FIX

  airflow-init:
    image: apache/airflow:2.7.3-python3.10
    command: version
    env_file:
      - .env
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname John --lastname Doe --role Admin --email admin@example.com
      "
    volumes:
      - ./airflow.db:/opt/airflow/airflow.db  # <--- CRITICAL FIX